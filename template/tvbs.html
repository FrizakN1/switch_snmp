{{ define "tvbs" }}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TVBS {{.IP}}</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #d1d5db;
            --accent: #0f766e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 20px;
            background:
                radial-gradient(circle at top left, rgba(15, 118, 110, 0.16), transparent 30%),
                linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
            color: var(--text);
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        .wrapper {
            max-width: 760px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .header p {
            margin: 0;
            color: var(--muted);
            font-size: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .card h2 {
            margin: 0 0 10px;
            font-size: 15px;
            font-weight: 600;
            color: var(--muted);
        }

        .value {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
            word-break: break-word;
        }

        .serial {
            grid-column: 1 / -1;
        }

        .value-accent {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <h1>TVBS</h1>
            <p>IP: {{.IP}}</p>
        </div>
        <div class="grid">
            <section class="card">
                <h2>Мощность на выходе</h2>
                <div class="value value-accent">{{.OutputPower}}</div>
            </section>
            <section class="card">
                <h2>Мощность на входе</h2>
                <div class="value value-accent">{{.InputPower}}</div>
            </section>
            <section class="card serial">
                <h2>Серийный номер</h2>
                <div class="value">{{.SerialNumber}}</div>
            </section>
        </div>
    </div>
</body>
</html>
{{ end }}
